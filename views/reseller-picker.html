<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC3 — Acceso Revendedores</title>
  <link rel="stylesheet" href="/css/main.css?v=20261118">
  <link rel="stylesheet" href="/css/admin.css?v=20261118">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="login-page">
  <div class="login-box" style="max-width:420px">
    <div class="login-logo">
      <img src="/PC3logo.png" alt="PC3 Argentina" onerror="this.src='/PC3logo-whitevariant.png'">
      <div style="font-size:12px;color:var(--color-text-faint);margin-top:4px;text-transform:uppercase;letter-spacing:0.1em">Acceso Revendedores</div>
    </div>

    <h2 class="login-title">¿Quién sos?</h2>
    <p class="text-sm text-muted" style="text-align:center;margin-top:-8px;margin-bottom:20px">
      Elegí tu nombre para armar el carrito y cargar tu venta.
    </p>

    <div id="reseller-list" style="display:flex;flex-direction:column;gap:10px">
      <div class="loader-wrap"><div class="loader-dots"><span></span><span></span><span></span></div></div>
    </div>

    <div id="reseller-error" class="login-error" style="display:none;margin-top:16px"></div>

    <div style="text-align:center;margin-top:20px">
      <a href="/" style="font-size:13px;color:var(--color-text-faint)">← Ir al catálogo público</a>
    </div>
  </div>
</div>

<script>
(async function () {
  const listEl  = document.getElementById('reseller-list');
  const errorEl = document.getElementById('reseller-error');
  try {
    const res = await fetch('/api/resellers');
    if (!res.ok) throw new Error('No se pudo cargar la lista de revendedores');
    const resellers = await res.json();

    if (!resellers.length) {
      listEl.innerHTML = '<p class="text-sm text-muted" style="text-align:center">No hay revendedores cargados todavía.</p>';
      return;
    }

    listEl.innerHTML = resellers.map(r => `
      <a href="/revendedor/${encodeURIComponent(r.slug)}" class="btn btn-primary btn-lg btn-block" style="text-decoration:none">
        ${r.name}
      </a>
    `).join('');
  } catch (e) {
    listEl.innerHTML = '';
    errorEl.textContent = e.message;
    errorEl.style.display = 'block';
  }
}());
</script>
</body>
</html>
