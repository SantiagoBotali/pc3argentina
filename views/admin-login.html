<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC3 Admin — Iniciar sesión</title>
  <link rel="stylesheet" href="/css/main.css?v=20261118">
  <link rel="stylesheet" href="/css/admin.css?v=20261118">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img src="/PC3logo.png" alt="PC3 Argentina" onerror="this.src='/PC3logo-whitevariant.png'">
      <div style="font-size:12px;color:var(--color-text-faint);margin-top:4px;text-transform:uppercase;letter-spacing:0.1em">Panel de administración</div>
    </div>

    <h2 class="login-title">Iniciar sesión</h2>

    <!-- Error message if ?error=1 -->
    <div id="login-error" class="login-error" style="display:none">
      Usuario o contraseña incorrectos.
    </div>

    <form action="/admin/login" method="POST" id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="pc3argentina"
          autocomplete="username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px">
        Ingresar al panel
      </button>
    </form>

    <div style="text-align:center;margin-top:16px">
      <a href="/" style="font-size:13px;color:var(--color-text-faint)">← Volver al catálogo</a>
    </div>
  </div>
</div>

<script>
  // Show error if URL param present
  if (new URLSearchParams(window.location.search).get('error')) {
    document.getElementById('login-error').style.display = 'block';
  }
</script>
</body>
</html>
